name: build & publish events

on:
  schedule:
    # noon Pacific all year (Steve, 2026-10-29): GitHub cron is UTC, so it fires at both noon hours —
    # 19:53 UTC is noon in daylight time, 20:53 UTC in standard time — and the gate job
    # below lets through only the one that is noon in America/Los_Angeles today; the other run is skipped, not failed
    - cron: '53 19 * * *'
    - cron: '53 20 * * *'
  workflow_dispatch:
    inputs:
      schedule:
        description: 'test the noon gate: a cron line to act as (blank = just build)'
        required: false
        default: ''
  push:
    branches: [main]

jobs:
  gate:
    # Is this run noon in America/Los_Angeles? A push or a plain dispatch always builds;
    # a scheduled run builds only when its cron hour is noon there today
    # (decided by the cron that fired, not the clock — GitHub starts
    # scheduled runs late, sometimes by most of an hour).
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.noon.outputs.run }}
    steps:
      - id: noon
        env:
          CITY_TZ: America/Los_Angeles
          FIRED: ${{ github.event.schedule || inputs.schedule }}
        run: |
          if [ -z "$FIRED" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "$GITHUB_EVENT_NAME, not a scheduled run: build"; exit 0; fi
          off=$(TZ=$CITY_TZ date +%z)   # -0700 in daylight time, -0800 in standard time
          h=$((10#${off:1:2})); if [ "${off:0:1}" = "-" ]; then noon=$(( (12 + h) % 24 )); else noon=$(( (36 - h) % 24 )); fi
          hour=$(echo "$FIRED" | awk '{print $2}')
          if [ "$((10#$hour))" -eq "$noon" ]; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "fired as '$FIRED'; noon in $CITY_TZ (UTC$off) is $noon:00 UTC today: run=$run"
  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    concurrency:   # one build at a time; a newer run waits instead of cancelling this one
      group: pages-build
      cancel-in-progress: false
    permissions:
      contents: write   # to push the archive record to the `archive` branch
      issues: write     # the "Calls failing after retries" issue (scripts/failure-issue.mjs)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6   # uv runs scripts/cffi-fetch.py (curl_cffi: a Chrome TLS fingerprint) for the venue calendars that refuse GitHub's runners 403/406 (2026-10-30)
      - name: Test
        run: node --test scripts/*.test.mjs
      - name: Fetch & aggregate events
        env:
          ALLOW_NO_ARCHIVE: ${{ vars.ALLOW_NO_ARCHIVE }}   # set to 1 for the very first build only (no live feed, no archive branch yet), then delete the variable
        run: node scripts/fetch-events.mjs
      - name: Sitemap, robots.txt and event structured data
        run: node scripts/seo.mjs && node scripts/seo-places.mjs   # seo-places: curling's rows are all over the map, not in one city
      - name: Keep the archive branch (every past event ever published)
        # The build read both copies of the archive (live feed + this branch)
        # and wrote their union to events-archive.json; commit it here when it
        # changed. Pushes to `archive` don't trigger this workflow (main only).
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -e
          dir=$(mktemp -d)
          if ! git clone -q --depth 1 --branch archive "$REMOTE" "$dir" 2>/dev/null; then
            echo "no archive branch yet — creating it"
            git init -q -b archive "$dir"
            git -C "$dir" remote add origin "$REMOTE"
          fi
          cp events-archive.json "$dir/"
          cd "$dir"
          git add events-archive.json
          if git diff --cached --quiet; then echo "archive unchanged"; exit 0; fi
          n=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("events-archive.json")).events.length)')
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Archive record: $n past events"
          git push -q origin archive
          echo "archive branch updated: $n past events"
      - name: Stamp asset versions (cache busting)
        run: sed -i "s/__V__/${GITHUB_SHA::12}/g" site/index.html site/advertise.html site/sources.html site/about.html site/faq.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Mail Steve about calls still failing after their retries (one issue, assigned to him; a mail only for a new failure; never fails the run)
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/failure-issue.mjs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:   # deploys queue too, never cancel each other
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: IndexNow ping (Bing, DuckDuckGo, Yandex read it; Google does not)
        # the key is public by design: it is served as site/<key>.txt, which is how IndexNow checks the sender owns the host
        continue-on-error: true
        run: |
          site="${{ steps.deployment.outputs.page_url }}"; host="${site#https://}"; host="${host%/}"
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            -d "{\"host\":\"$host\",\"key\":\"fe2ea473c89f46282202fd67297ff630\",\"urlList\":[\"$site\"]}" -o /dev/null -w "indexnow $host: HTTP %{http_code}\n"
